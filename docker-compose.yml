version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reflex-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: reflex-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
